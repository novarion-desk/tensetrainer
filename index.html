<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tense Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#312E81">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tense Trainer">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e1d8;--accent:#2f5bea;--ok:#1a8a4a;--okbg:#e7f6ee;--bad:#c93c3c;--badbg:#fdeceb;--warn:#a1650f;--warnbg:#fdf3e1;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn-link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 8px;border-radius:8px}
.btn-link:hover{background:rgba(47,91,234,.08)}
.btn-link.sm{font-size:14px;padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--ink)}
.chip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 13%,#fff)}
.links{margin-top:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;color:var(--ink)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--muted);font-size:14px}
.mode.on{border-color:var(--accent);background:#eef2fe}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.count-in{width:5.5em;border:2px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:600}
.count-in.on{border-color:var(--accent);background:#eef2fe}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:#cfd4dc;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.primary{display:block;width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;padding:14px;border-radius:12px}
.primary:hover{filter:brightness(1.07)}
.primary:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.5em}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.bar{height:8px;background:#e6e3da;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.instr{font-weight:700;margin:0 0 14px;font-size:18px}
.sentence{font-size:22px;line-height:1.9;margin:6px 0 14px}
.sentence input{font:inherit;font-size:20px;border:0;border-bottom:3px solid var(--accent);background:#f1f4fe;padding:2px 6px;border-radius:6px 6px 0 0;min-width:6ch;max-width:100%;color:var(--ink)}
.sentence input:focus{outline:none;background:#e6ecfd}
.hint{color:var(--muted);font-size:18px;white-space:nowrap}
.tt{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 80%,#000);border:1px solid color-mix(in srgb,var(--c) 35%,#fff)}
.src{font-size:21px;background:#f7f6f2;border-left:4px solid var(--line);padding:10px 14px;border-radius:8px;margin-bottom:10px}
.sig{margin:0 0 12px;color:var(--muted)}
.sig b{color:var(--ink)}
textarea.full{width:100%;font:inherit;font-size:20px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;min-height:3.2em}
textarea.full:focus{outline:none;border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:700;color:var(--ink)}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--okbg)}
.opts button.wrong{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
mark{background:#fff0a8;padding:0 3px;border-radius:4px}
.fb{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:16px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.warn{background:var(--warnbg)}
.fbt{font-weight:800;font-size:18px;margin-bottom:4px}
.fb.ok .fbt{color:var(--ok)}.fb.bad .fbt{color:var(--bad)}.fb.warn .fbt{color:var(--warn)}
.sol{font-size:18px;margin:6px 0}
.rule{margin-top:8px}
.tip{margin-top:8px;font-weight:600}
.actions{margin-top:16px}
.big{font-size:56px;font-weight:800;text-align:center;line-height:1.1}
.big small{display:block;font-size:17px;color:var(--muted);font-weight:600}
.stat{display:grid;grid-template-columns:170px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.stat .track{height:10px;background:#eee;border-radius:99px;overflow:hidden}
.stat .track div{height:100%}
.mist{border-top:1px solid var(--line);padding:10px 0;font-size:16px}
.mist .you{color:var(--bad)}
.btns{display:grid;gap:10px}
.secondary{width:100%;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:17px;padding:12px;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(20,24,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:10}
.modal.hidden{display:none}
.modal .card{max-width:720px;width:100%}
.rt{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rt p{margin:4px 0}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fs{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;color:var(--ink);min-width:44px}
.fs:hover{border-color:var(--accent)}
.fs:disabled{opacity:.35;cursor:default}
.name{display:block;width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;border:0;border-bottom:2px dashed var(--line);padding:6px;margin-bottom:12px;color:var(--ink)}
.name:focus{outline:none;border-bottom-color:var(--accent)}
.center{text-align:center}.muted{color:var(--muted)}
.shot{text-align:center;background:#f1f4fe;border-radius:10px;padding:8px 10px;margin:12px 0 0;font-weight:600}
details.all summary{cursor:pointer;font-weight:700;padding:2px 0}
details.all[open] summary{margin-bottom:8px}
.mist.r-bad{background:var(--badbg);border-radius:8px;padding:10px;margin:6px 0;border:0}
.mist.r-ok{border-top:1px solid var(--line)}
.okc{color:var(--ok);font-weight:600}
.info{background:#f7f6f2;border-radius:10px;padding:12px 14px;margin:10px 0 4px;font-size:15px}
.info p{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
header{flex-wrap:wrap;gap:8px}
.lang{border-width:2px}.lang button{padding:4px 10px;font-size:14px;font-weight:800}
/* Verbliste */
.vtools{position:sticky;top:-20px;background:#fff;padding:4px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:6px}
.vsearch{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}
.vsearch:focus{outline:none;border-color:var(--accent)}
.vrow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vseg button{padding:5px 12px;font-size:14px}
.vcount{color:var(--muted);font-size:14px}
.vsec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:16px 0 4px}
.vlegend{font-size:13px;color:var(--muted);margin:0 0 6px}
.vt{width:100%;border-collapse:collapse;font-size:16px}
.vt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.vt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vt tr:nth-child(even) td{background:#faf9f6}
.vt td.b{font-weight:800}
.vt td.de{color:var(--muted);font-size:15px}
.vt td.f{color:#1d3fb3;font-weight:600}
.vtag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.vtag.dbl,.vtag.y{background:var(--warnbg);color:var(--warn)}
.vtag.e{background:#eef0f3;color:#5b6475}
.vt mark{padding:0 1px}
@media (max-width:560px){.vt thead th:last-child{display:none}.vt th{padding:6px}.vt tr{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}.vt td{border:0;padding:4px 6px}.vt td.de{grid-column:1/-1;padding-top:0}}
@media (max-width:520px){.sentence{font-size:19px}.opts{grid-template-columns:1fr}.stat{grid-template-columns:120px 1fr 40px}}

/* ---- Arbeitsblatt (Vorschau + Druck) ---- */
.sheetbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sheetbar button{flex:1;min-width:130px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:16px;color:#111;font-size:15px;line-height:1.45}
.sheet h1{font-size:1.3em;margin:0 0 2px}
.sheet .sub{color:#555;font-size:.9em;margin:0 0 10px}
.sheet .meta{display:flex;gap:24px;margin:10px 0 16px}
.sheet .meta span{flex:1;border-bottom:1px solid #333;padding-bottom:2px;font-size:.9em;color:#444}
.sheet .t{break-inside:avoid;margin:0 0 14px}
.sheet .t .n{font-weight:700;margin-right:6px}
.sheet .t .ins{font-size:.82em;color:#555;margin-bottom:2px}
.sheet .blank{display:inline-block;border-bottom:1.5px solid #222;height:1.05em;vertical-align:baseline}
.sheet .wl{border-bottom:1px solid #999;height:1.9em}
.sheet .opt{display:inline-block;margin-right:14px;white-space:nowrap}
.sheet .box{display:inline-block;width:.8em;height:.8em;border:1.5px solid #222;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sheet .hint{color:#555}
.sheet .sol-list{columns:1}
.sheet .sol-list div{break-inside:avoid;margin:0 0 5px}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff;font-size:12pt}
 header,footer,.sheetbar,.modal{display:none!important}
 .wrap{max-width:none;padding:0}
 .sheet{border:0;border-radius:0;padding:0;margin:0;font-size:12pt}
 .sheet.sol{break-before:page}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Tense<span>Trainer</span></div>
    <div class="hdr-r">
      <div class="seg lang" id="langSeg" role="group" aria-label="Language / Sprache"><button data-l="en">EN</button><button data-l="de">DE</button></div>
      <button class="fs" id="fsMinus" aria-label="A−">A−</button>
      <button class="fs" id="fsPlus" aria-label="A+">A+</button>
      <button class="btn-link" id="rulesBtn">📘 Rules</button>
      <button class="btn-link" id="verbsBtn">📋 Verbs</button>
      <button class="btn-link" id="feedbackBtn">💬 Feedback</button>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot">Tense Trainer</footer>
</div>
<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function vforms(v){
 const b=v.b,last=b.slice(-1),cy=/[^aeiou]y$/.test(b);
 const s3=v.s3||(/(s|x|z|ch|sh|o)$/.test(b)?b+'es':cy?b.slice(0,-1)+'ies':b+'s');
 const ing=v.ing||(/ie$/.test(b)?b.slice(0,-2)+'ying':/[^e]e$/.test(b)?b.slice(0,-1)+'ing':v.dbl?b+last+'ing':b+'ing');
 const p=v.p||(/e$/.test(b)?b+'d':cy?b.slice(0,-1)+'ied':v.dbl?b+last+'ed':b+'ed');
 return {b,s3,ing,p,pp:v.pp||p};
}
// Passt das Objekt zu Zeitform, Satzart und Subjekt?
function objOK(obj,t,form,s){
 if(!obj.tags.includes(TENSE_TAG[t]))return false;
 if(obj.kid&&s&&s.adult)return false;
 if(obj.sing&&s&&s.k==='pl'&&s.w!=='you')return false;
 if(obj.acc&&form==='neg')return false; // «didn't lose his wallet» klingt seltsam
 if(t==='PRP'&&form!=='pos'){if(obj.acc)return false;if(!(obj.yet||(form==='q'&&obj.ever)))return false}
 return true;
}
function markerFor(t,form,obj){
 if(t==='PRP'){
  if(form==='pos')return {w:obj.acc?'just':rnd(['already','just']),mid:true};
  if(form==='q'&&obj.ever&&(!obj.yet||Math.random()<.6))return {w:'ever',mid:true};
  return {w:'yet',mid:false};
 }
 const m=MARK[t];let list=obj.rare&&m.r?m.r:m.d;
 if(t==='SP'&&!obj.rare&&obj.day)list=m.day; // tägliche Routine → every day / every morning
 if(t==='WF'&&form==='neg')list=list.filter(w=>!['soon','one day','in the future'].includes(w)); // «won't … soon» klingt unnatürlich
 return {w:rnd(list),mid:false};
}
function build(t,form,s,vf,objStr,mk){
 const s3=s.k==='3s',i1=s.k==='1s';
 const be=i1?'am':s3?'is':'are',beN=i1?'am not':s3?"isn't":"aren't";
 const was=(i1||s3)?'was':'were',wasN=(i1||s3)?"wasn't":"weren't";
 const has=s3?'has':'have',hasN=s3?"hasn't":"haven't";
 const dO=s3?'does':'do',dN=s3?"doesn't":"don't";
 const mid=mk.mid?mk.w+' ':'';
 let pos,neg,qa,qr;
 switch(t){
  case 'SP':pos=s3?vf.s3:vf.b;neg=dN+' '+vf.b;qa=dO;qr=vf.b;break;
  case 'PP':pos=be+' '+vf.ing;neg=beN+' '+vf.ing;qa=be;qr=vf.ing;break;
  case 'SPA':pos=vf.p;neg="didn't "+vf.b;qa='did';qr=vf.b;break;
  case 'PAP':pos=was+' '+vf.ing;neg=wasN+' '+vf.ing;qa=was;qr=vf.ing;break;
  case 'PRP':pos=has+' '+mid+vf.pp;neg=hasN+' '+mid+vf.pp;qa=has;qr=mid+vf.pp;break;
  case 'WF':pos='will '+vf.b;neg="won't "+vf.b;qa='will';qr=vf.b;break;
  case 'GT':pos=be+' going to '+vf.b;neg=beN+' going to '+vf.b;qa=be;qr='going to '+vf.b;break;
 }
 const tail=' '+objStr+(mk.mid?'':' '+mk.w);
 if(form==='q')return {before:'',gap:cap(qa)+' '+s.w+' '+qr,after:tail+'?'};
 return {before:cap(s.w)+' ',gap:form==='neg'?neg:pos,after:tail+'.'};
}
function pickSubj(noI){let s;do{s=rnd(SUBJ)}while(noI&&s.k==='1s');return s}
// Zufälliges Verb + Objekt, das zu allen angegebenen Zeitformen passt
function pickVO(tenses,form,s){
 for(let i=0;i<500;i++){
  const v=rnd(VERBS),obj=rnd(v.o);
  if(tenses.every(t=>objOK(obj,t,form,s)))return {v,obj};
 }
 return null;
}
function genItem(t,form,o={}){
 const s=o.s||pickSubj(form==='q');
 let v=o.v,obj=o.obj;
 if(!v){const p=pickVO([t],form,s);v=p.v;obj=p.obj}
 const vf=vforms(v);
 const objStr=obj.o.replace('{poss}',s.poss);
 const mk=o.mk||markerFor(t,form,obj);
 const p=build(t,form,s,vf,objStr,mk);
 const hint=form==='q'?s.w+' / '+(mk.mid?mk.w+' / ':'')+vf.b:form==='neg'?'not / '+vf.b:(mk.mid?mk.w+' / ':'')+vf.b;
 return {src:'gen',t,form,s,v,vf,obj,mk,...p,hint,sentence:p.before+p.gap+p.after};
}
function poolItem(p){
 const m=p.s.match(/^(.*)\{(.+?)\}(.*)$/);
 return {src:'pool',t:p.t,form:p.f||'pos',sq:!!p.sq,before:m[1],gap:m[2],after:m[3],hint:p.h,sentence:m[1]+m[2]+m[3],mk:null,alt:p.alt||[]};
}
function ctxItem(p){const it=poolItem(p);it.type='ctx';it.why=p.w;return it}
function genTrans(t,forms,tenses){
 const srcT=(tenses||ORDER).filter(x=>x!==t);
 let other=forms.filter(f=>f!=='pos');
 let kind=(forms.includes('pos')&&other.length&&Math.random()<.5)?'form':'tense';
 if(!srcT.length){kind='form';if(!other.length)other=['neg','q']}
 let src,tgt,instr;
 if(kind==='form'){
  const tf=rnd(other),s=pickSubj(tf==='q');
  const p=pickVO([t],'pos',s);let vo=p;
  for(let i=0;i<300&&!(objOK(vo.obj,t,tf,s));i++)vo=pickVO([t],'pos',s);
  src=genItem(t,'pos',{s,v:vo.v,obj:vo.obj});
  tgt=genItem(t,tf,{s,v:vo.v,obj:vo.obj,mk:(t==='PRP'||(t==='WF'&&tf==='neg'&&src.mk.w==='soon'))?null:src.mk});
  instr=tf==='neg'?'neg':'q';
 }else{
  const f=rnd(forms),s=pickSubj(f==='q');
  let S=rnd(srcT),vo=pickVO([S,t],f,s);
  for(let i=0;i<30&&!vo;i++){S=rnd(srcT);vo=pickVO([S,t],f,s)}
  if(!vo)return genTrans(t,forms.includes('pos')?forms:['pos',...forms],[t]);
  src=genItem(S,f,{s,v:vo.v,obj:vo.obj});tgt=genItem(t,f,{s,v:vo.v,obj:vo.obj});
  instr='tense';
 }
 return {type:'trans',kind,t,form:tgt.form,src,tgt,instr,mk:tgt.mk,showMk:kind==='tense'||tgt.mk.w!==src.mk.w,sentence:tgt.sentence};
}

function shortAns(t,pr,yes){
 const k=pr==='I'?'1s':(pr==='he'||pr==='she')?'3s':'pl',s3=k==='3s',i1=k==='1s';
 const A={
  SP:[s3?'does':'do',s3?"doesn't":"don't"],
  PP:[i1?'am':s3?'is':'are',i1?"'m not":s3?"isn't":"aren't"],
  SPA:['did',"didn't"],
  PAP:[(i1||s3)?'was':'were',(i1||s3)?"wasn't":"weren't"],
  PRP:[s3?'has':'have',s3?"hasn't":"haven't"],
  WF:['will',"won't"]};
 A.GT=A.PP;
 const a=A[t][yes?0:1];
 return (yes?'Yes, ':'No, ')+pr+(a.startsWith("'")?'':' ')+a+'.';
}
function genShort(t){
 const q=genItem(t,'q'),yes=Math.random()<.5;
 const answers=q.s.pr.map(p=>shortAns(t,p,yes));
 return {type:'short',t,form:'q',mk:null,q,yes,answers,vf:q.vf,sentence:q.sentence+' – '+answers[0]};
}

// Amerikanische und britische Schreibweise gelten beide (werden vor dem Vergleich vereinheitlicht)
const AE={traveled:'travelled',traveling:'travelling',practise:'practice',practises:'practices',practised:'practiced',practising:'practicing',colour:'color',favourite:'favorite',neighbours:'neighbors',neighbour:'neighbor',centre:'center',theatre:'theater',realise:'realize',realised:'realized',organise:'organize',organised:'organized',grey:'gray',cancelled:'canceled',cancelling:'canceling'};
function norm(str){
 let s=' '+String(str).toLowerCase().replace(/[’‘`´]/g,"'")+' ';
 s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/n't\b/g,' not')
  .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will')
  .replace(/[.,!?;:"()]/g,' ').replace(/\s+/g,' ').trim();
 s=s.replace(/\b(do|does|did|is|are|was|were|has|have|had)nt\b/g,'$1 not').replace(/\bwont\b/g,'will not').replace(/\bim\b/g,'i am');
 s=s.split(' ').map(w=>AE[w]||w).join(' ');
 if(/'s\b/.test(s))return [s.replace(/'s\b/g,' is'),s.replace(/'s\b/g,' has')];
 return [s];
}
function eq(a,b){const A=norm(a),B=norm(b);return A.some(x=>B.includes(x))}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function near(user,exps){
 let best=99,L=0;const U=norm(user);
 for(const e of exps)for(const x of norm(e)){L=Math.max(L,x.length);for(const u of U)best=Math.min(best,lev(u,x))}
 return best<=(L>14?2:1);
}
function checkTrans(it,user){
 const mw=norm(it.mk.w)[0],U=norm(user),E=norm(it.sentence);
 const strip=x=>(' '+x+' ').replace(' '+mw+' ',' ').replace(/\s+/g,' ').trim();
 const hasM=u=>(' '+u+' ').includes(' '+mw+' ');
 if(U.some(u=>hasM(u)&&E.some(e=>strip(u)===strip(e))))return 'ok';
 if(U.some(u=>!hasM(u)&&E.some(e=>u===strip(e))))return 'nomark';
 return 'bad';
}
function errHint(it,user){
 const g=it.type==='trans'?it.tgt:it;
 if(!g.vf)return '';
 const u=' '+norm(user)[0]+' ',has=w=>u.includes(' '+w+' ');
 const v=g.vf,t=g.t,f=g.form,s3=g.s.k==='3s';
 if(t==='SPA'&&f!=='pos'&&v.p!==v.b&&has(v.p))return L(`Nach <b>did / didn't</b> steht die Grundform: <b>${v.b}</b> (nicht ${v.p}).`,`After <b>did / didn't</b> use the base form: <b>${v.b}</b> (not ${v.p}).`);
 if(t==='SP'&&f!=='pos'&&s3&&has(v.s3))return L(`Nach <b>does / doesn't</b> steht die Grundform ohne -s: <b>${v.b}</b>.`,`After <b>does / doesn't</b> use the base form without -s: <b>${v.b}</b>.`);
 if(t==='SP'&&f==='pos'&&s3&&has(v.b)&&!has(v.s3))return L(`he / she / it – das <b>-s</b> muss mit: <b>${v.s3}</b>.`,`he / she / it – don't forget the <b>-s</b>: <b>${v.s3}</b>.`);
 if(t==='PRP'&&v.p!==v.pp&&has(v.p)&&!has(v.pp))return L(`Present Perfect braucht die 3. Form: <b>${v.pp}</b> (nicht ${v.p}).`,`The Present Perfect needs the 3rd form: <b>${v.pp}</b> (not ${v.p}).`);
 if((t==='PP'||t==='PAP')&&!has(v.ing))return L(`Continuous-Form: Verb + <b>-ing</b> → <b>${v.ing}</b>.`,`Continuous form: verb + <b>-ing</b> → <b>${v.ing}</b>.`);
 if(t==='PP'&&!['am','is','are'].some(has))return L(`Vergiss <b>am / is / are</b> nicht.`,`Don't forget <b>am / is / are</b>.`);
 if(t==='PAP'&&!['was','were'].some(has))return L(`Vergiss <b>was / were</b> nicht.`,`Don't forget <b>was / were</b>.`);
 if(t==='GT'&&!has('going'))return L(`going to-Future: <b>am / is / are + going to</b> + Grundform.`,`going to-future: <b>am / is / are + going to</b> + base form.`);
 if(t==='WF'&&!has('will'))return L(`will-Future: <b>will</b> (verneint: <b>won't</b>) + Grundform.`,`will-future: <b>will</b> (negative: <b>won't</b>) + base form.`);
 return '';
}

// Übungsarten ausgewogen verteilen: jede etwa gleich oft, zufällige Reihenfolge, nie mehr als 2× dieselbe hintereinander
function typeSequence(n){
 const m=S.modes.length?S.modes:['fill'];
 let bag=[];
 const seq=[];
 for(let i=0;i<n;i++){
  if(!bag.length)bag=m.slice().sort(()=>Math.random()-.5);
  let j=0;
  if(m.length>1&&seq.length>=2&&seq[seq.length-1]===seq[seq.length-2]){j=bag.findIndex(x=>x!==seq[seq.length-1]);if(j<0){bag=m.filter(x=>x!==seq[seq.length-1]).sort(()=>Math.random()-.5);j=0}}
  seq.push(bag.splice(j,1)[0]);
 }
 return seq;
}
function buildRound(n){

  seen.add(it.sentence);globalSeen.add(it.sentence);out.push(it);
 }
 return out;
}

 renderTask();
}

function tenseTag(it){
 if(S.hint)return `<span class="tt" style="--c:${T[it.t].c}">${T[it.t].name}</span>`;
 if(it.t==='WF')return `<span class="tt" style="--c:${T.WF.c}">will</span>`;
 if(it.t==='GT')return `<span class="tt" style="--c:${T.GT.c}">going to</span>`;
 return '';
}
function renderTask(){
 screen='task';
 const it=items[idx];answered=false;tries=0;
 const TYPE_LABEL=TYPE_LABEL_();
 let body='';
 if(it.type==='rec'){
  const sel=S.tenses.filter(x=>x!==it.t);
  const others=sel.length?shuffle(sel):shuffle(ORDER.filter(x=>x!==it.t));
  const opts=shuffle([it.t,...others.slice(0,3)]);
  body=`<p class="instr">${L('Welche Zeitform ist das?','Which tense is it?')}</p>
   <div class="sentence" id="sent">${esc(it.sentence)}</div>
   <div class="opts">${opts.map(k=>`<button data-o="${k}">${T[k].name}</button>`).join('')}</div>`;
 }else if(it.type==='fill'){
  const w=Math.max(8,it.gap.length+3);
  body=`<p class="instr">${it.form==='q'?L('Ergänze die Frage.','Complete the question.'):L('Setze das Verb in der richtigen Form ein.','Put the verb in the correct form.')} ${tenseTag(it)}</p>
   <div class="sentence">${esc(it.before)}<input id="inp" style="width:${w}ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(it.after)} <span class="hint">(${esc(it.hint)})</span></div>`;
 }else if(it.type==='ctx'){
  const w=Math.max(8,it.gap.length+3);
  body=`<p class="instr">${L('Welche Zeit passt? Setze das Verb richtig ein.','Which tense fits? Put the verb in the correct form.')}</p>
   <div class="sentence">${esc(it.before)}<input id="inp" style="width:${w}ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(it.after)} <span class="hint">(${esc(it.hint)})</span></div>`;
 }else if(it.type==='short'){
  body=`<p class="instr">${L('Antworte mit einer Kurzantwort:','Give a short answer:')} ${it.yes?L('👍 <b>Ja</b>','👍 <b>Yes</b>'):L('👎 <b>Nein</b>','👎 <b>No</b>')}</p>
   <div class="src">${esc(it.q.sentence)}</div>
   <textarea class="full" id="inp" rows="1" placeholder="${it.yes?'Yes, …':'No, …'}" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>`;
 }else{
  body=`<p class="instr">${instrText(it)}</p>
   <div class="src">${esc(it.src.sentence)}</div>
   ${it.showMk?`<p class="sig">${L('Signalwort','Signal word')}: <b>${esc(it.mk.w)}</b></p>`:''}
   <textarea class="full" id="inp" rows="2" placeholder="${L('Schreib den ganzen Satz …','Write the whole sentence …')}" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false"></textarea>`;
 }
 app.innerHTML=`
 <div class="qtop"><button class="btn-link" id="quit">${infinite?L('✓ Fertig','✓ Done'):L('✕ Beenden','✕ Quit')}</button><span>${infinite?L('Aufgabe ','Task ')+(idx+1)+' · ∞':(idx+1)+' / '+items.length}</span><span>⭐ ${score}</span></div>
 ${infinite?'':`<div class="bar"><div style="width:${idx/items.length*100}%"></div></div>`}
 <div class="card"><div class="tag">${TYPE_LABEL[it.type]}</div>${body}
  <div id="fb"></div>
  <div class="actions">${it.type==='rec'?'':`<button class="primary" id="go">${L('Prüfen','Check')}</button>`}</div></div>`;
 app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='quit'){
  if(infinite&&results.length)return renderResults();
  if(results.length&&!confirm(L('Runde wirklich beenden?\nDeine bisherigen Antworten gehen verloren.','Really quit this round?\nYour answers so far will be lost.')))return;
  return renderSetup();
 }
  if(b.dataset.o&&!answered)return answerRec(b.dataset.o);
  if(b.id==='go')return answered?next():check();
 };
 const inp=document.getElementById('inp');if(inp)inp.focus();
}
function shortHint(it,val){
 const u=' '+norm(val)[0]+' ',v=it.vf;
 if(!/^ ?(yes|no) /.test(u))return L('Beginne mit <b>Yes,</b> oder <b>No,</b>','Start with <b>Yes,</b> or <b>No,</b>');
 if([v.b,v.s3,v.p,v.pp,v.ing].some(w=>u.includes(' '+w+' ')))return L('Bei Kurzantworten wiederholst du nur das <b>Hilfsverb</b> – nicht das ganze Verb.','In short answers you only repeat the <b>auxiliary verb</b> – not the whole verb.');
 return L('Nimm das <b>Hilfsverb aus der Frage</b> und pass es an das Pronomen an.','Take the <b>auxiliary verb from the question</b> and match it to the pronoun.');
}
function explain(it){
 const d=T[it.t];
 if(it.type==='short')return `<div class="rule">${L('<b>Kurzantwort:</b> Yes / No + Pronomen + <b>Hilfsverb aus der Frage</b> (do, does, did, am, is, are, was, were, have, has, will).<br>Aus „you“ wird „I“ oder „we“, aus „Tom“ wird „he“.','<b>Short answer:</b> Yes / No + pronoun + <b>auxiliary verb from the question</b> (do, does, did, am, is, are, was, were, have, has, will).<br>“you” becomes “I” or “we”, “Tom” becomes “he”.')}</div><div class="rule"><span class="tt" style="--c:${d.c}">${d.name}</span></div>`;
 let h=it.why?`<div class="rule"><b>${L('Warum?','Why?')}</b> ${esc(cap(whyText(it.why)))}</div>`:'';
 h+=`<div class="rule"><span class="tt" style="--c:${d.c}">${d.name}</span> ${TD(it.t,'use')}.<br><b>${L('Bildung','Form')}:</b> ${it.sq?L('Frage nach dem Subjekt (<b>Who / What / Which …?</b>): <b>kein</b> do / does / did, keine Umstellung – das Verb steht wie im Aussagesatz.','Question about the subject (<b>Who / What / Which …?</b>): <b>no</b> do / does / did, no inversion – the verb stays as in a statement.'):TD(it.t,it.form)}</div>`;
 if(it.mk)h+=`<div class="rule"><b>${L('Signalwort','Signal word')}:</b> <i>${esc(it.mk.w)}</i> → ${d.name}</div>`;
 return h;
}
function markSent(it){return esc(it.before)+'<mark>'+esc(it.gap)+'</mark>'+esc(it.after)}
function finish(ok,user,html,kind){
 answered=true;if(ok)score++;
 results.push({item:items[idx],ok,user,retry:ok&&tries>0});
 document.getElementById('fb').innerHTML=`<div class="fb ${kind}">${html}</div>`;
 const act=document.querySelector('.actions');
 act.innerHTML=`<button class="primary" id="go">${(infinite||idx+1<items.length)?L('Weiter →','Next →'):L('Auswertung →','Results →')}</button>`;
 document.querySelector('.qtop span:last-child').textContent='⭐ '+score;
 const inp=document.getElementById('inp');if(inp)inp.disabled=true;
 document.getElementById('go').focus();
}
function answerRec(k){
 const it=items[idx],ok=k===it.t;
 document.querySelectorAll('.opts button').forEach(b=>{b.disabled=true;if(b.dataset.o===it.t)b.classList.add('right');else if(b.dataset.o===k)b.classList.add('wrong')});
 document.getElementById('sent').innerHTML=markSent(it);
 finish(ok,T[k].name,`<div class="fbt">${ok?L('Richtig! 🎉','Correct! 🎉'):L('Leider falsch.','Sorry, wrong.')}</div>${ok?'':L(`Das ist <b>${T[it.t].name}</b>.<br>`,`This is <b>${T[it.t].name}</b>.<br>`)}${L('Erkennbar an','You can tell by')}: <mark>${esc(it.gap)}</mark>${explain(it)}`,ok?'ok':'bad');
}
function check(){
 const it=items[idx],inp=document.getElementById('inp'),val=inp.value.trim();
 if(!val){inp.focus();return}
 const fb=document.getElementById('fb');
 let ok,nomark=false;
 if(it.type==='fill'||it.type==='ctx'){ok=[it.gap,...(it.alt||[])].some(a=>eq(val,a))||eq(val,it.sentence)}
 else if(it.type==='short'){ok=it.answers.some(a=>eq(val,a))}
 else{const r=checkTrans(it,val);ok=r==='ok';nomark=r==='nomark'}
 if(!ok&&tries===0){
  if(nomark){tries=1;fb.innerHTML=`<div class="fb warn"><div class="fbt">${L('Fast!','Almost!')}</div>${L(`Das Signalwort <b>${esc(it.mk.w)}</b> fehlt noch. Noch ein Versuch.`,`The signal word <b>${esc(it.mk.w)}</b> is missing. Try again.`)}</div>`;inp.focus();return}
  if(near(val,(it.type==='fill'||it.type==='ctx')?[it.gap,...(it.alt||[])]:it.type==='short'?it.answers:[it.sentence])){tries=1;fb.innerHTML=`<div class="fb warn"><div class="fbt">${L('Fast!','Almost!')}</div>${L('Prüfe die Schreibweise. Noch ein Versuch.','Check the spelling. Try again.')}</div>`;inp.focus();return}
 }
 const sol=(it.type==='fill'||it.type==='ctx')?markSent(it)+((it.alt&&it.alt.length)?`<br><small>${L('Auch richtig','Also correct')}: <b>${esc(it.alt.join(' / '))}</b></small>`:''):'<mark>'+esc(it.type==='short'?it.answers.join(L('  oder  ','  or  ')):it.sentence)+'</mark>';
 const tip=ok?'':it.type==='short'?shortHint(it,val):errHint(it,val);
 finish(ok,val,`<div class="fbt">${ok?L('Richtig! 🎉','Correct! 🎉'):L('Leider falsch.','Sorry, wrong.')}</div>
  ${ok?'':`<div>${L('Deine Antwort','Your answer')}: <s>${esc(val)}</s></div>`}
  <div class="sol">${ok?(tries?`<small>${L('(im 2. Versuch)','(2nd try)')}</small><br>`:''):L('Richtig ist: ','Correct answer: ')}${sol}</div>
  ${tip?`<div class="tip">💡 ${tip}</div>`:''}${explain(it)}`,ok?'ok':'bad');
}
function next(){
 idx++;
 if(infinite&&idx>=items.length-2)items=items.concat(buildRound(10));
 idx<items.length?renderTask():renderResults();
}

function taskText(r){
 const it=r.item;
 const YA=L('Deine Antwort','Your answer'),SOL=L('Lösung','Solution');
 if(it.type==='rec')return `${markSent(it)}<br><small>${L('Deine Wahl','Your choice')}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span>${r.ok?'':` · ${L('Richtig','Correct')}: <b>${T[it.t].name}</b>`}</small>`;
 if(it.type==='trans')return `<span class="muted">${esc(it.src.sentence)}</span> → ${esc(instrText(it))}<br>${SOL}: <mark>${esc(it.sentence)}</mark><br><small>${YA}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span></small>`;
 if(it.type==='short')return `${esc(it.q.sentence)} (${it.yes?L('Ja','Yes'):L('Nein','No')})<br>${SOL}: <mark>${esc(it.answers.join(' / '))}</mark><br><small>${YA}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span></small>`;
 return `${markSent(it)}${it.alt&&it.alt.length?` <small>(${L('auch','also')}: ${esc(it.alt.join(' / '))})</small>`:''}<br><small>${YA}: <span class="${r.ok?'okc':'you'}">${esc(r.user)}</span></small>`;
}
function renderResults(){
 screen='results';
 const TYPE_LABEL=TYPE_LABEL_(),MODES=MODES_();
 const n=results.length;
 const pct=n?Math.round(score/n*100):0;
 const msg=pct>=90?L('Hervorragend! 🏆','Excellent! 🏆'):pct>=70?L('Gut gemacht! 👍','Well done! 👍'):pct>=50?L('Nicht schlecht – weiter üben! 💪','Not bad – keep practising! 💪'):L('Bleib dran – nochmal üben hilft! 🔁','Keep going – practice helps! 🔁');
 const by={};results.forEach(r=>{const k=r.item.t;by[k]=by[k]||{n:0,ok:0};by[k].n++;if(r.ok)by[k].ok++});
 const wrong=results.filter(r=>!r.ok),retry=results.filter(r=>r.retry).length;
 const modeL=S.modes.map(k=>MODES.find(m=>m.k===k)).filter(Boolean);
 const d=new Date(),loc=L('de-CH','en-GB'),date=d.toLocaleDateString(loc)+', '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});
 app.innerHTML=`
 <div class="card">
  <input class="name" id="name" placeholder="${L('Dein Name','Your name')}" value="${esc(studentName)}" autocomplete="off">
  <div class="big">${score} / ${n}<small>${msg}</small></div>
  ${retry?`<p class="center muted">${L(`davon ${retry} im 2. Versuch`,`${retry} of them on the 2nd try`)}</p>`:''}
  <p class="center muted">${date} · ${modeL.map(m=>m.icon+' '+m.label).join(', ')} · ${S.tenses.map(k=>T[k].name).join(', ')}</p>
  <p class="shot">${L('📸 Mach einen Screenshot, falls deine Lehrperson dein Resultat sehen will.','📸 Take a screenshot if your teacher wants to see your result.')}</p>
 </div>
 <div class="card"><h2>${L('Nach Zeitform','By tense')}</h2>${ORDER.filter(k=>by[k]).map(k=>{const p=Math.round(by[k].ok/by[k].n*100);return `<div class="stat"><span>${T[k].name}</span><div class="track"><div style="width:${p}%;background:${T[k].c}"></div></div><b>${by[k].ok}/${by[k].n}</b></div>`}).join('')}</div>
 <details class="card all">
  <summary>${L('📋 Alle Antworten und Lösungen anzeigen','📋 Show all answers and solutions')} <span class="muted">(${n-wrong.length} ✓ · ${wrong.length} ✗)</span></summary>
  ${results.map((r,i)=>`<div class="mist ${r.ok?'r-ok':'r-bad'}"><b>${i+1}. ${r.ok?'✓':'✗'}</b> <span class="tt" style="--c:${T[r.item.t].c}">${T[r.item.t].name}</span> <small class="muted">${TYPE_LABEL[r.item.type]}${r.retry?L(' · 2. Versuch',' · 2nd try'):''}</small><br>${taskText(r)}</div>`).join('')}
 </details>
 <div class="btns">
  ${wrong.length?`<button class="primary" id="redo">${L('Fehler nochmal üben','Practise mistakes again')}</button>`:''}
  <button class="${wrong.length?'secondary':'primary'}" id="again">${L('Neue Runde','New round')}</button>
  <button class="secondary" id="setup">${L('Einstellungen ändern','Change settings')}</button>
 </div>`;
 document.getElementById('name').oninput=e=>{studentName=e.target.value};
 app.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='redo')start(shuffle(wrong.map(r=>r.item)));
  if(b.id==='again')start();
  if(b.id==='setup')renderSetup();
 };
}

document.addEventListener('keydown',e=>{

function regNote(b,p){
 const b1=b.split(' / ')[0],p1=p.split(' / ')[0];
 if(/[^aeiou]y$/.test(b1)&&p1.endsWith('ied'))return 'y';
 const last=b1.slice(-1);
 if(p1===b1+last+'ed')return 'dbl';
 if(/e$/.test(b1)&&p1===b1+'d')return 'e';
 return '';
}
let vq='',vf='all';
const vnorm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
function vmatch(v,q){
 if(!q)return true;
 const forms=[v.b,v.p,v.pp].join(' / ').split(' / ').map(vnorm);
 return forms.some(f=>f.startsWith(q))||vnorm(v.de).split(/[;,()]\s*|\s+/).some(w=>w.startsWith(q))||vnorm(v.de).includes(q)&&q.length>=3;
}
function hl(text,q){
 if(!q)return esc(text);
 return text.split(' / ').map(t=>vnorm(t).startsWith(q)?`<mark>${esc(t)}</mark>`:esc(t)).join(' / ');
}
function noteTag(n){
 if(n==='dbl')return `<span class="vtag dbl">${L('Doppelkonsonant','double consonant')}</span>`;
 if(n==='y')return `<span class="vtag y">y → ied</span>`;
 if(n==='e')return `<span class="vtag e">${L('nur -d','only -d')}</span>`;
 return '';
}
function verbRows(list,q){
 return list.map(v=>`<tr><td class="b">${hl(v.b,q)}</td><td class="f">${hl(v.p,q)}${v.irr?'':noteTag(v.note)}</td><td class="f">${hl(v.pp,q)}</td><td class="de">${esc(v.de)}</td></tr>`).join('');
}
function verbTable(list,q){
 return `<table class="vt"><thead><tr><th>Infinitive</th><th>Past Simple</th><th>Past Participle</th><th>${L('Deutsch','German')}</th></tr></thead><tbody>${verbRows(list,q)}</tbody></table>`;
}
function renderVerbList(){
 const q=vnorm(vq.trim());
 const irr=vf!=='reg'?IRR.filter(v=>vmatch(v,q)):[];
 const reg=vf!=='irr'?REG.filter(v=>vmatch(v,q)):[];
 const box=document.getElementById('vlist');if(!box)return;
 box.innerHTML=(irr.length?`<div class="vsec">${L('Unregelmässige Verben','Irregular verbs')} (${irr.length})</div>${verbTable(irr,q)}`:'')+
  (reg.length?`<div class="vsec">${L('Regelmässige Verben','Regular verbs')} (${reg.length}) – ${L('Past Simple = Past Participle = Verb + -ed','Past Simple = Past Participle = verb + -ed')}</div>
   <p class="vlegend">${L('Achtung Schreibweise','Watch the spelling')}: stop → sto<b>pp</b>ed ${noteTag('dbl')} · study → stud<b>ied</b> ${noteTag('y')} · live → live<b>d</b> ${noteTag('e')}</p>${verbTable(reg,q)}`:'')+
  (!irr.length&&!reg.length?`<p class="center muted" style="padding:20px 0">${L('Kein Verb gefunden.','No verb found.')}</p>`:'');
 document.getElementById('vcount').textContent=`${irr.length+reg.length} ${L('Verben','verbs')}`;
}
function openVerbs(){
 modalKind='verbs';
 document.getElementById('modalBody').innerHTML=`<div class="vtools">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${L('Verbliste','Verb list')}</h2><button class="btn-link" id="mclose">${L('✕ Schliessen','✕ Close')}</button></div>
  <input class="vsearch" id="vsearch" type="search" placeholder="${L('Suchen: go, went, gone oder gehen …','Search: go, went, gone or gehen …')}" value="${esc(vq)}" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="vrow2"><div class="seg vseg" id="vseg">${[['all',L('Alle','All')],['irr',L('Unregelmässig','Irregular')],['reg',L('Regelmässig','Regular')]].map(([k,l])=>`<button data-vf="${k}" class="${vf===k?'on':''}">${l}</button>`).join('')}</div><span class="vcount" id="vcount"></span></div>
 </div><div id="vlist"></div>`;
 modal.classList.remove('hidden');
 document.getElementById('mclose').onclick=closeModal;
 const inp=document.getElementById('vsearch');
 inp.oninput=()=>{vq=inp.value;renderVerbList()};
 document.getElementById('vseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;vf=b.dataset.vf;document.querySelectorAll('#vseg button').forEach(x=>x.classList.toggle('on',x===b));renderVerbList()};
 renderVerbList();
 if(matchMedia('(pointer:fine)').matches)inp.focus();
}
document.getElementById('verbsBtn').onclick=openVerbs;

}
document.getElementById('langSeg').onclick=e=>{
 const b=e.target.closest('button');if(!b||b.dataset.l===LANG)return;
 LANG=b.dataset.l;try{localStorage.setItem('tt-lang',LANG)}catch(err){}
 applyLang();
 if(screen==='setup')renderSetup();
 else if(screen==='results')renderResults();
 else if(screen==='task'&&!answered){const v=(document.getElementById('inp')||{}).value;renderTask();const inp=document.getElementById('inp');if(inp&&v)inp.value=v}
 if(modalKind==='rules')openRules();else if(modalKind==='verbs')openVerbs();
};
applyLang();

// Schriftgrösse
const FS=[0.85,1,1.15,1.3,1.5,1.7];let fsi=1;
try{const v=+localStorage.getItem('tt-fs');if(v>=0&&v<FS.length)fsi=v}catch(e){}
function applyFs(){document.body.style.zoom=FS[fsi];document.getElementById('fsMinus').disabled=fsi===0;document.getElementById('fsPlus').disabled=fsi===FS.length-1;try{localStorage.setItem('tt-fs',fsi)}catch(e){}}
document.getElementById('fsMinus').onclick=()=>{if(fsi>0){fsi--;applyFs()}};
document.getElementById('fsPlus').onclick=()=>{if(fsi<FS.length-1){fsi++;applyFs()}};
applyFs();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
renderSetup();

/* ===== Zurück-Geste (Handy): ein Schritt zurück statt App schliessen ===== */
(function(){
 let pushed=false,mPushed=false,ign=0;
 const rS=renderSetup,rT=renderTask,rR=renderResults,rH=renderSheet;
 const push=()=>{if(!pushed){history.pushState({sub:1},'');pushed=true}};
 const pop=()=>{if(pushed){pushed=false;ign++;history.back()}};
 renderSetup=function(){pop();return rS.apply(this,arguments)};
 renderTask=function(){push();return rT.apply(this,arguments)};
 renderResults=function(){push();return rR.apply(this,arguments)};
 renderSheet=function(){push();return rH.apply(this,arguments)};
 const mod=document.getElementById('modal');
 if(mod)new MutationObserver(()=>{
  const open=!mod.classList.contains('hidden');
  if(open&&!mPushed){history.pushState({m:1},'');mPushed=true}
  else if(!open&&mPushed){mPushed=false;ign++;history.back()}
 }).observe(mod,{attributes:true,attributeFilter:['class']});
 window.addEventListener('popstate',()=>{
  if(ign>0){ign--;return}
  if(mPushed){mPushed=false;closeModal();return}
  if(pushed){
   pushed=false;
   if(screen==='task'&&results.length&&!infinite&&!confirm(L('Runde wirklich beenden?\nDeine bisherigen Antworten gehen verloren.','Really quit?\nYour answers so far will be lost.'))){history.pushState({sub:1},'');pushed=true;return}
   rS();
  }
 });
})();
</script>
<script id="update-notice">
/* Update-Hinweis: meldet unten eine Leiste, sobald die Seite auf dem Server neuer ist. Lädt nie von selbst neu. */
(function(){
  try{
    if(typeof fetch!=='function'||!/^https?:$/.test(location.protocol)||/[?&]demo\b/.test(location.search)||/\/versions\//.test(location.pathname)||window.EMBED_TOPIC||window.self!==window.top)return;
    var base=location.pathname.replace(/[^\/]*$/,'');
    var urls=[location.pathname,base+'sw.js'];
    [].slice.call(document.scripts).forEach(function(s){
      if(!s.src)return;var u=new URL(s.src,location.href);
      if(u.origin===location.origin&&!/\/vendor\//.test(u.pathname)&&urls.indexOf(u.pathname)<0)urls.push(u.pathname);
    });
    function sig(){
      return Promise.all(urls.map(function(u){
        return fetch(u,{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?(r.headers.get('etag')||r.headers.get('last-modified')||''):'';});
      })).then(function(a){return a.join('|');}).catch(function(){return null;});
    }
    var baseSig=null,shown=false,snooze=0;
    function bar(){
      if(shown)return;shown=true;
      var b=document.createElement('div');b.setAttribute('role','status');
      b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483000;max-width:min(94vw,520px);background:#1e293b;color:#fff;border-radius:14px;padding:.7rem .9rem;box-shadow:0 8px 28px rgba(0,0,0,.35);font:600 15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;justify-content:center';
      var t=document.createElement('span');t.textContent='Neue Version verfügbar.';
      var go=document.createElement('button'),later=document.createElement('button'),busy=document.createElement('div');
      var st='border:0;border-radius:10px;padding:.5rem .9rem;font:700 15px system-ui,sans-serif;cursor:pointer;min-height:40px;';
      go.textContent='Jetzt laden';go.style.cssText=st+'background:#38bdf8;color:#0f172a';
      later.textContent='Später';later.style.cssText=st+'background:transparent;color:#cbd5e1';
      busy.style.cssText='flex-basis:100%;font:500 13px system-ui,sans-serif;color:#fde68a;text-align:center';
      try{var m=window.__updateBusy&&window.__updateBusy();if(m)busy.textContent=m;}catch(e){}
      go.onclick=function(){
        go.disabled=true;go.textContent='Lädt …';
        try{window.__updateSave&&window.__updateSave();}catch(e){}
        var done=false,reload=function(){if(done)return;done=true;location.reload();};
        setTimeout(reload,4000);
        Promise.all(urls.map(function(u){return fetch(u,{cache:'reload'}).catch(function(){});})).then(reload,reload);
      };
      later.onclick=function(){b.remove();shown=false;snooze=Date.now()+30*60*1000;};
      b.appendChild(t);b.appendChild(go);b.appendChild(later);b.appendChild(busy);document.body.appendChild(b);
    }
    function check(){
      if(shown||Date.now()<snooze)return;
      sig().then(function(s){
        if(!s||!/[^|]/.test(s))return;
        if(baseSig===null){baseSig=s;return;}
        if(s!==baseSig)bar();
      });
    }
    window.addEventListener('load',function(){setTimeout(check,1500);});
    setInterval(check,5*60*1000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
    window.addEventListener('online',check);
  }catch(e){}
})();
</script>
